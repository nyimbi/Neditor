name: NEditor Release Publish

# Publishes a GitHub Release with signed platform artifacts on v*.*.* tag push.
# Separately auto-bumps the Homebrew cask tap on GA releases.
#
# See docs/release-publish-workflow.md for the full run-book.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + sign but do NOT create the GitHub Release"
        type: boolean
        default: false
      auto_merge_cask:
        description: "Commit directly to tap (false = open PR)"
        type: boolean
        default: false
      tap_repo:
        description: "Homebrew tap repository (owner/name)"
        type: string
        default: "nyimbi/homebrew-neditor"

concurrency:
  group: neditor-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

# ---------------------------------------------------------------------------
# GUARD — fast version-consistency check before any build runner starts.
# ---------------------------------------------------------------------------
jobs:
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        id: versions
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Tag:         $TAG"
          echo "package.json: $PKG"
          echo "tauri.conf:   $TAURI"
          if [ "$TAG" != "v$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version v$PKG"
            exit 1
          fi
          if [ "$PKG" != "$TAURI" ]; then
            echo "::error::package.json ($PKG) and src-tauri/tauri.conf.json ($TAURI) versions differ"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Release readiness check
        run: pnpm run check:release-readiness

  # ---------------------------------------------------------------------------
  # BUILD — macOS (universal DMG), Windows (MSI + NSIS), Linux (deb + AppImage).
  # All three run in parallel, each depending only on the guard job.
  # ---------------------------------------------------------------------------

  build-macos:
    name: Build macOS universal DMG
    runs-on: macos-latest
    needs: guard
    timeout-minutes: 90
    outputs:
      signed: ${{ steps.sign-status.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Rust (with universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust target (macOS universal)
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target/aarch64-apple-darwin
            src-tauri/target/x86_64-apple-darwin
            src-tauri/target/universal-apple-darwin
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-macos-universal-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-macos-universal-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-macos-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      # Import P12 into a short-lived keychain so codesign(1) and xcrun can
      # find the identity.  Tauri also reads APPLE_CERTIFICATE as a base64 blob;
      # the keychain import is an additional safety net for tools that call
      # codesign directly (xcrun notarytool staple, spctl, etc.).
      # TODO(human): if APPLE_CERTIFICATE alone is sufficient for your Tauri
      # version, remove the keychain steps to reduce attack surface.
      - name: Import Apple signing certificate into keychain
        if: env.APPLE_CERT_P12_BASE64 != ''
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "::add-mask::$APPLE_CERT_PASSWORD"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT_PATH="$RUNNER_TEMP/neditor-apple.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/neditor-build.keychain-db"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 900 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "NEDITOR_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Build universal macOS DMG
        timeout-minutes: 60
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      # Belt-and-suspenders: explicitly codesign + runtime-harden the app
      # bundle and verify with spctl after Tauri's own signing pass.
      # TODO(human): if src-tauri/entitlements.plist does not yet exist, create
      # it (at minimum an empty dict) or remove the --entitlements flag below.
      - name: Explicit codesign + runtime hardening
        if: env.APPLE_CERT_P12_BASE64 != '' && env.APPLE_TEAM_ID != ''
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::warning::No DMG found; skipping explicit codesign step."
          else
            MOUNT="$(mktemp -d)"
            hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -readonly
            APP=$(find "$MOUNT" -name "*.app" -maxdepth 1 | head -1)
            if [ -n "$APP" ]; then
              ENTITLEMENTS=""
              if [ -f "src-tauri/entitlements.plist" ]; then
                ENTITLEMENTS="--entitlements src-tauri/entitlements.plist"
              fi
              codesign --force --deep --options runtime \
                $ENTITLEMENTS \
                --sign "Developer ID Application" "$APP" || true
              spctl --assess -vv --type execute "$APP" || \
                echo "::warning::spctl assess failed (expected if not yet notarized)"
            fi
            hdiutil detach "$MOUNT" || true
          fi

      # notarytool submission is handled by Tauri when APPLE_ID is set.
      # This step validates the staple and runs spctl on the final DMG.
      - name: Verify notarization staple and Gatekeeper clearance
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::warning::No DMG found; skipping staple verification."
          else
            xcrun stapler validate "$DMG" && echo "Staple OK: $DMG"
            spctl --assess -vv --type open \
              --context context:primary-signature "$DMG" || \
              echo "::warning::DMG spctl assess failed"
          fi

      - name: Set macOS signing status
        id: sign-status
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$APPLE_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::APPLE_ID absent — DMG will be unsigned (pre-release)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete temporary keychain
        if: always() && env.NEDITOR_KEYCHAIN_PATH != ''
        run: security delete-keychain "$NEDITOR_KEYCHAIN_PATH"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: neditor-release-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows MSI + NSIS
    runs-on: windows-latest
    needs: guard
    timeout-minutes: 90
    outputs:
      signed: ${{ steps.sign-status.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target (Windows)
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target/release
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-windows-x86_64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-windows-x86_64-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/pnpm/store
          key: pnpm-windows-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-windows-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Build Windows installers (MSI + NSIS)
        timeout-minutes: 60
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/run-tauri-build.mjs --bundles msi,nsis

      # Authenticode sign MSI + NSIS exe with signtool.  Skip cleanly if the
      # PFX secret is absent (unsigned build ships as a pre-release).
      # TODO(human): verify whether your Tauri version already signs via
      # WINDOWS_CERTIFICATE; if so, remove this step to avoid double-signing.
      - name: Sign MSI + NSIS with signtool
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          echo "::add-mask::$env:WINDOWS_CERT_PASSWORD"
          $pfxPath = Join-Path $env:RUNNER_TEMP "neditor-win.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $artifacts = Get-ChildItem "src-tauri/target/release/bundle" -Recurse `
            -Include "*.msi","*.exe" -ErrorAction SilentlyContinue
          foreach ($a in $artifacts) {
            signtool sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD `
              /tr http://timestamp.sectigo.com /td SHA256 $a.FullName
            Write-Host "Signed: $($a.Name)"
          }
          Remove-Item $pfxPath -Force

      - name: Set Windows signing status
        id: sign-status
        shell: bash
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if [ -n "$WINDOWS_CERT_PFX_BASE64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WINDOWS_CERT_PFX_BASE64 absent — installers will be unsigned (pre-release)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neditor-release-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux deb + AppImage
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 90
    outputs:
      signed: ${{ steps.sign-status.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target (Linux)
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target/release
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-linux-x86_64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-linux-x86_64-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-linux-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Build Linux packages (deb + AppImage)
        timeout-minutes: 60
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/run-tauri-build.mjs --bundles deb,appimage

      # GPG-sign AppImage and produce a .deb.asc detached signature.
      # Skip cleanly if GPG_SIGNING_KEY_BASE64 is absent.
      - name: GPG-sign Linux artifacts
        if: env.GPG_SIGNING_KEY_BASE64 != ''
        env:
          GPG_SIGNING_KEY_BASE64: ${{ secrets.GPG_SIGNING_KEY_BASE64 }}
          GPG_SIGNING_KEY_PASSWORD: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: |
          echo "::add-mask::$GPG_SIGNING_KEY_PASSWORD"
          echo "$GPG_SIGNING_KEY_BASE64" | base64 --decode | \
            gpg --batch --yes --passphrase "$GPG_SIGNING_KEY_PASSWORD" --import
          for f in \
            $(find src-tauri/target/release/bundle/appimage -name "*.AppImage" 2>/dev/null) \
            $(find src-tauri/target/release/bundle/deb -name "*.deb" 2>/dev/null); do
            gpg --batch --yes --passphrase "$GPG_SIGNING_KEY_PASSWORD" \
              --detach-sign --armor --output "${f}.asc" "$f"
            echo "GPG-signed: $f"
          done

      - name: Set Linux signing status
        id: sign-status
        env:
          GPG_SIGNING_KEY_BASE64: ${{ secrets.GPG_SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$GPG_SIGNING_KEY_BASE64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GPG_SIGNING_KEY_BASE64 absent — Linux artifacts will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neditor-release-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb.asc
            src-tauri/target/release/bundle/appimage/*.AppImage.asc
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # PUBLISH — compute SHA256SUMS, create GitHub Release.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [guard, build-macos, build-windows, build-linux]
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      released: ${{ steps.create-release.outputs.released }}
      prerelease: ${{ steps.prerelease-check.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: neditor-release-macos
          path: dist/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: neditor-release-windows
          path: dist/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: neditor-release-linux
          path: dist/linux

      - name: Compute SHA256SUMS
        run: |
          find dist -type f | sort | xargs sha256sum > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      # GA requires both macOS and Windows signing.  Linux GPG signing
      # is desirable but not required to promote to GA.
      - name: Determine pre-release status
        id: prerelease-check
        env:
          MACOS_SIGNED: ${{ needs.build-macos.outputs.signed }}
          WINDOWS_SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          if [ "$MACOS_SIGNED" = "true" ] && [ "$WINDOWS_SIGNED" = "true" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "::notice::All required signatures present — marking as GA release."
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing incomplete (macOS=$MACOS_SIGNED Windows=$WINDOWS_SIGNED) — marking as pre-release."
          fi

      # Prefer a hand-written release notes file at docs/release-notes/<tag>.md;
      # fall back to GitHub's auto-generated notes from the commit range.
      - name: Resolve release notes
        id: release-notes
        run: |
          NOTES_FILE="docs/release-notes/${{ github.ref_name }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "notes_flag=--notes-file $NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "notes_flag=--generate-notes" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        id: create-release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.prerelease-check.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # shellcheck disable=SC2086  — notes_flag is intentionally unquoted
          gh release create "$TAG" \
            $PRERELEASE_FLAG \
            ${{ steps.release-notes.outputs.notes_flag }} \
            --title "NEditor $TAG" \
            dist/macos/*.dmg \
            dist/windows/*.msi \
            dist/windows/*.exe \
            dist/linux/*.deb \
            dist/linux/*.AppImage \
            $(find dist/linux -name "*.asc" 2>/dev/null || true) \
            SHA256SUMS
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Dry-run summary (no Release created)
        if: inputs.dry_run == true
        run: |
          echo "::notice::Dry run active — skipping gh release create."
          echo "Artifacts that would be published:"
          find dist -type f | sort
          echo "SHA256SUMS:"
          cat SHA256SUMS
          echo "released=false" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # HOMEBREW — auto-bump the cask tap.  Runs only on signed GA releases.
  # ---------------------------------------------------------------------------
  homebrew:
    name: Homebrew cask auto-bump
    runs-on: ubuntu-latest
    needs: [guard, build-macos, publish]
    if: >-
      needs.publish.outputs.released == 'true' &&
      needs.publish.outputs.prerelease == 'false' &&
      needs.build-macos.outputs.signed == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout NEditor repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Download the signed DMG so release:homebrew can compute its SHA256.
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: neditor-release-macos
          path: dist/macos

      - name: Generate Homebrew cask
        run: |
          DMG=$(find dist/macos -name "*.dmg" | head -1)
          pnpm run release:homebrew -- --artifact "$DMG"

      - name: Validate generated cask
        env:
          NEDITOR_HOMEBREW_CASK: .tmp/homebrew/external/neditor.rb
        run: pnpm run check:homebrew

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tap_repo || 'nyimbi/homebrew-neditor' }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Copy cask to tap repo
        run: |
          mkdir -p homebrew-tap/Casks
          cp .tmp/homebrew/external/neditor.rb homebrew-tap/Casks/neditor.rb

      - name: Commit and push (or open PR) to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ inputs.tap_repo || 'nyimbi/homebrew-neditor' }}
          VERSION: ${{ needs.guard.outputs.version }}
          AUTO_MERGE: ${{ inputs.auto_merge_cask || 'false' }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/neditor.rb
          if git diff --cached --quiet; then
            echo "::notice::Homebrew cask is already up to date; nothing to push."
            exit 0
          fi
          if [ "$AUTO_MERGE" = "true" ]; then
            git commit -m "chore: bump neditor to v$VERSION"
            git push
          else
            BRANCH="bump/neditor-v${VERSION}"
            git checkout -b "$BRANCH"
            git commit -m "chore: bump neditor to v$VERSION"
            git push origin "$BRANCH"
            gh pr create \
              --repo "$TAP_REPO" \
              --title "chore: bump neditor to v$VERSION" \
              --body "Automated cask bump from the NEditor release publish workflow (tag v${VERSION}). Review, test with \`brew install --cask neditor\`, and merge." \
              --base main \
              --head "$BRANCH"
          fi
